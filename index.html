<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to AWS Amplify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2fe; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background-color: #ffffff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); text-align: center; max-width: 520px; width: 90%; }
    .cloud-icon { font-size: 40px; margin-bottom: 15px; }
    h1 { color: #5833c7; font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
    .subtitle { color: #6c757d; font-size: 1.05rem; margin-bottom: 15px; }
    .description { color: #555555; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
    .btn { background-color: #e2f7e8; color: #2b7a41; border: none; padding: 12px 24px; font-size: 0.95rem; font-weight: 600; border-radius: 20px; cursor: pointer; margin-bottom: 25px; }
    .footer { color: #888888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="cloud-icon">☁️</div>
    <h1>Welcome to AWS Amplify</h1>
    <p class="subtitle">Experiment 6: Web Application Hosting</p>
    <p class="description">This webpage demonstrates how a web application can be hosted using AWS Amplify and a GitHub repository.</p>
    <button class="btn">Experiment Webpage</button>
    <p class="footer">Cloud Computing Laboratory</p>
  </div>
</body>
</html>
